# Modern clipboard support (reattach-to-user-namespace no longer needed with tmux 2.6+)
set-option -g default-command "zsh"
set-option -s set-clipboard on

# remap prefix to Control + a
unbind-key C-b
set-option -g prefix C-a

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf

# quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# 256 colors
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',tmux-256color:RGB'

# speed things up
set-option -s escape-time 10

# Pass focus events to applications (e.g. Vim autoread)
set-option -g focus-events on

# status bar
set -g status 2
set -g 'status-format[0]' ""
set -g 'status-format[1]' "#[align=left range=left #{E:status-left-style}]#{T;=/#{status-left-length}:status-left}#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#{T:window-status-format}#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}]#{T:window-status-current-format}#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#{T;=/#{status-right-length}:status-right}#[norange default]"
set -g status-style "bg=default,fg=colour252"
set -g status-left '[#S] '
set -g status-right '#[fg=magenta]%a  %Y-%m-%d  %H:%M#[default]'
set -g status-right-length 120
set -g status-left-length 40

# Auto-rename windows based on running command
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Highlight windows running a process (not just shell)
setw -g window-status-separator " "
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#[fg=cyan,bold]#I:#W#[default]"

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Bind ']' to paste from system clipboard
if-shell "uname | grep -q Darwin" \
  "bind ] run 'pbpaste | tmux load-buffer - && tmux paste-buffer'" \
  "bind ] run 'xclip -o -selection clipboard | tmux load-buffer - && tmux paste-buffer'"

# Kill current session
bind q confirm-before -p "kill-session #S? (y/n)" kill-session

# Session picker on prefix + s: the same aligned list `tls` prints outside
# tmux, in a popup.
#
# Three things here are load-bearing, each found the hard way:
#   /bin/sh -c   a bare command path never starts. tmux runs a popup through
#                default-command, which is zsh here, and the popup dies before
#                the command does -- so it flashes and closes with no error
#                anywhere. Wrapping in sh -c is what makes it run.
#   -EE          two Es keep the popup open when the command fails, so the
#                next failure is readable instead of invisible.
#   no #{...}    formats are NOT expanded in a key-bound popup command, and a
#                literal "#" starts a comment in sh -- so a format here makes
#                sh treat the whole command as a comment and exit 0, which
#                even -EE reads as success. The tilde is expanded by sh, which
#                keeps this portable without a format.
#
# choose-tree is the fallback if this ever breaks: its -F format is only the
# text after a fixed "<session name>: " label, so nothing in it can be aligned,
# which is why it is not the default any more.
bind s display-popup -EE -w 80% -h 60% "/bin/sh -c '~/Projects/dotfiles/bin/tmux-sessions --pick'"
bind C-s choose-tree -Zs -O time -F "#{p-2:session_windows}w #{t/p:session_activity}"

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'

# Bootstrap TPM if not installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
